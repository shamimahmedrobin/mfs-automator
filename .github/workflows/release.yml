name: Auto Release

# On every push to main: bump the version, build a release APK and publish it
# as a GitHub Release. The app's built-in updater checks the latest release,
# so phones pick up the new version automatically (see the Auto-update setting).
#
# NOTE on signing: without keystore secrets this builds with the debug keystore
# fallback from app/build.gradle.kts. That is fine as long as the APK on the
# phone was installed from one of these CI releases (signatures must match).
# To sign with your upload key instead, add secrets and wire them here:
#   KEYSTORE_PATH / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(python3 .github/workflows/bump_version.py)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]" || echo "nothing to commit"
          git push || echo "push failed (concurrent release?) - continuing"

      - name: Prepare Keystore
        # Signatures MUST stay stable across releases, otherwise Android (and
        # the app's own signature check) will refuse to install updates.
        # Commit a debug.keystore.base64 once at repo root and every CI build
        # will sign with the same key.
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding committed keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "WARNING: no debug.keystore.base64 in repo - generating a fresh key."
            echo "This APK's signature will differ from other releases; auto-update across keys will NOT work."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            "app/build/outputs/apk/release/app-release.apk" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes
